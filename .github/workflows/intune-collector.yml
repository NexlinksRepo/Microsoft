name: Intune collector offline checks

on:
  push:
    paths:
      - 'Intune/IntuneReadinessCollector/**'
      - '.github/workflows/intune-collector.yml'
  pull_request:
    paths:
      - 'Intune/IntuneReadinessCollector/**'
      - '.github/workflows/intune-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: Intune/IntuneReadinessCollector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the version used by the original Pester suite
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse all scripts and JSON source files
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if (@($parseErrors).Count) { throw ($parseErrors | Out-String) }
          }
          Get-Content query-manifest.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content intune-readiness.schema.json -Raw | ConvertFrom-Json | Out-Null
      - name: Run existing offline checks
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Script ./tests/Collector.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw 'Collector package checks failed.' }
          & ./tests/Report.Offline.Tests.ps1
          & ./tests/Debug.Offline.Tests.ps1
