name: M365 Sign-in Audit Report

on:
  push:
    paths:
      - "Microsoft365/M365SignInAuditReport/**"
      - ".github/workflows/m365-signin-audit.yml"
  pull_request:
    paths:
      - "Microsoft365/M365SignInAuditReport/**"
      - ".github/workflows/m365-signin-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: Microsoft365/M365SignInAuditReport
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run M365 audit report smoke tests
        run: ./tests/SmokeTest.ps1
